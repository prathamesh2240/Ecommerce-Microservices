server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    healthcheck:
      enabled: true
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:dGVzdF9zZWNyZXRfa2V5X211c3RfYmVfbWluXzMyX2J5dGVzX2xvbmdfZm9yX2hzMjU2X3NlY3VyZQ==}

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet: TRACE
